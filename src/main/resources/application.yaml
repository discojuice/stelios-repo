  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: liquibase
    password: liquibase
    driver-class-name: org.postgresql.Driver

#  jpa:
#    hibernate:
#      ddl-auto: update
#    show-sql: true
#    defer-datasource-initialization: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: never
#      platform: h2
      continue-on-error: false

