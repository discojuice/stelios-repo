spring:
  profiles:
    active: dev

  application:
    name: demo

  datasource:
    url: jdbc:h2:file:./data/librarydb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      platform: h2
      continue-on-error: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
    swagger-ui:
      path: /swagger

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.springframework.jdbc.datasource.init: debug
