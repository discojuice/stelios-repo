server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: liquibase
    password: liquibase
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: never
      continue-on-error: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger