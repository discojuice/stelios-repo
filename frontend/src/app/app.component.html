<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Stelio's space</div>

    <button class="menu-btn" [class.active]="activePage === 'bio'" (click)="goToBio()">
      Bio
    </button>

    <button class="menu-btn" [class.active]="activePage === 'blog'" (click)="goToBlog()">
      Blog
    </button>

    <button class="menu-btn" [class.active]="activePage === 'requests'" (click)="goToRequests()">
      Requests
    </button>
  </aside>

  <main class="content">
    <app-blog [hidden]="activePage !== 'blog'"></app-blog>
    <app-requests [hidden]="activePage !== 'requests'"></app-requests>
    <app-bio [hidden]="activePage !== 'bio'"></app-bio>
  </main>
</div>
